name: funnelbase_flutter_android
description: The Android implementation of funnelbase_flutter, over the native Funnelbase Android SDK.
version: 0.1.0
repository: https://github.com/Funnelbase/funnelbase-flutter/tree/main/packages/funnelbase_flutter_android
homepage: https://funnel-base.com
issue_tracker: https://github.com/Funnelbase/funnelbase-flutter/issues
topics:
  - analytics
  - push-notifications

resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: '>=3.41.0'

# One platform of the federated plugin (docs/sdk-flutter.md in the repository). The Kotlin side
# depends on the native Android SDK, com.funnel-base:funnelbase-android, from Maven Central.
flutter:
  plugin:
    implements: funnelbase_flutter
    platforms:
      android:
        package: com.funnelbase.sdk.flutter
        pluginClass: AnalyticsFlutterPlugin
        dartPluginClass: AnalyticsAndroid

dependencies:
  flutter:
    sdk: flutter
  funnelbase_flutter_platform_interface: ^0.1.0
  # Pigeon's generated Dart imports it.
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^27.3.0
